version: '3.8'

services:
  redis:
    image: redis:7.0-alpine
    container_name: oob_redis
    ports:
      - "6379:6379"
    networks:
      oob_net:
        ipv4_address: 10.0.1.5

  webdis:
    image: nicolasff/webdis:latest
    container_name: oob_webdis
    ports:
      - "7379:7379"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      oob_net:
        ipv4_address: 10.0.1.6

  target_rtu:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim
        WORKDIR /app
        COPY scada_emulator/target_rtu.py .
        CMD ["python", "target_rtu.py"]
    container_name: oob_target_rtu
    environment:
      - LISTEN_IP=0.0.0.0
      - LISTEN_PORT=20000
    networks:
      oob_net:
        ipv4_address: 10.0.1.20

  scada_sender:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim
        RUN pip install --no-cache-dir requests redis
        WORKDIR /app
        COPY scada_emulator/send_dnp3_with_oob_trace.py .
        CMD ["python", "send_dnp3_with_oob_trace.py"]
    container_name: oob_scada_sender
    environment:
      - WEBDIS_HOST=webdis
      - WEBDIS_PORT=7379
      - SRC_IP=10.0.1.10
      - DST_IP=10.0.1.20
      - DST_PORT=20000
      - FUNCTION_CODE=5
    networks:
      oob_net:
        ipv4_address: 10.0.1.10
    depends_on:
      - webdis
      - target_rtu

  sidecar:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim
        RUN pip install --no-cache-dir requests
        WORKDIR /app
        COPY sidecar/sync_redis_to_csv.py .
        CMD ["python", "sync_redis_to_csv.py"]
    container_name: oob_sidecar
    environment:
      - WEBDIS_HOST=webdis
      - WEBDIS_PORT=7379
      - VECTOR_API_URL=http://vector:8686
      - CSV_PATH=/data/webdis_cache.csv
      - POLL_INTERVAL=1.0
    volumes:
      - shared_data:/data
    networks:
      oob_net:
        ipv4_address: 10.0.1.7
    depends_on:
      - webdis
      - vector

  vector:
    image: timberio/vector:0.34.1-alpine
    container_name: oob_vector
    ports:
      - "8686:8686"
    volumes:
      - ./vector_config/vector.toml:/etc/vector/vector.toml:ro
      - shared_data:/data
    networks:
      oob_net:
        ipv4_address: 10.0.1.8

volumes:
  shared_data:

networks:
  oob_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24
