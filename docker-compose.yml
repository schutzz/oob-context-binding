version: '3.8'

services:
  redis:
    image: redis:7.0-alpine
    container_name: oob_redis
    network_mode: "host"

  webdis:
    image: nicolas/webdis:0.1.20
    container_name: oob_webdis
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
    network_mode: "host"
    depends_on:
      - redis

  vector:
    image: timberio/vector:0.34.0-alpine
    container_name: oob_vector
    volumes:
      - ./vector_config:/etc/vector
    command: ["-c", "/etc/vector/vector.toml"]
    network_mode: "host"

  sidecar:
    build:
      context: ./sidecar
    container_name: oob_sidecar
    environment:
      - WEBDIS_HOST=127.0.0.1
      - WEBDIS_PORT=7379
      - VECTOR_API_URL=http://127.0.0.1:8686
      - CSV_PATH=/etc/vector/webdis_cache.csv
      - POLL_INTERVAL=1.0
    volumes:
      - ./vector_config:/etc/vector
    network_mode: "host"
    depends_on:
      - webdis
      - vector

  ebpf_vanguard:
    build:
      context: ./ebpf_vanguard
    container_name: oob_ebpf_vanguard
    cap_drop:
      - ALL
    cap_add:
      - BPF
      - PERFMON
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - no-new-privileges:true
    network_mode: "host"
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/btf:/sys/kernel/btf:ro
    command: ["eth0"]

  rtu:
    build:
      context: ./scada_emulator
    container_name: oob_rtu
    command: ["python", "-u", "target_rtu.py"]
    environment:
      - LISTEN_IP=0.0.0.0
      - LISTEN_PORT=20000
    network_mode: "host"

  scada_sender:
    build:
      context: ./scada_emulator
    container_name: oob_scada_sender
    command: ["python", "-u", "send_dnp3_with_oob_trace.py"]
    environment:
      - WEBDIS_HOST=127.0.0.1
      - WEBDIS_PORT=7379
      - SRC_IP=127.0.0.1
      - DST_IP=127.0.0.1
      - DST_PORT=20000
      - FUNCTION_CODE=5
    network_mode: "host"
    depends_on:
      - webdis
      - rtu
      - ebpf_vanguard
